name: Hobnob
description: 'Hobnob is a consumer event and community-organizing platform (hobnob.app)
  for iOS, Android, and web. It lets people create custom video and photo invitations,
  deliver them by text message, track RSVPs, sell tickets, run sign-up lists, time
  polls, and announcements, and coordinate private group "Spaces" for chat and content
  sharing. Built on a Hawaii-inspired philosophy of real-world connection over engagement-maximizing
  social media, Hobnob reports 20 million invitations sent, roughly 35,000 events per
  month, 650,000 Spaces created, and 90,000+ five-star reviews. It is a Norwest Venture
  Partners portfolio company. No public developer API, SDK, or documentation surface
  was found during enrichment.'
